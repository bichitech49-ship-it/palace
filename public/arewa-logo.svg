<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background transparent -->
  
  <!-- 1. The 4-Pointed Concave Green Star (North, East, South, West) -->
  <path
    d="M 100 8
       C 100 68, 132 100, 192 100
       C 132 100, 100 132, 100 192
       C 100 132, 68 100, 8 100
       C 68 100, 100 68, 100 8 Z"
    fill="#088532"
    stroke="#000000"
    stroke-width="7"
    stroke-linejoin="round"
  />

  <!-- 2. The Two Crossed Pill-Loops (North-West to South-East, and North-East to South-West) -->
  <!-- Loop A: -45 deg (NW to SE) -->
  <rect
    x="78"
    y="22"
    width="44"
    height="156"
    rx="22"
    ry="22"
    transform="rotate(-45 100 100)"
    fill="#ffffff"
    stroke="#000000"
    stroke-width="7"
  />

  <!-- Loop B: +45 deg (NE to SW) -->
  <rect
    x="78"
    y="22"
    width="44"
    height="156"
    rx="22"
    ry="22"
    transform="rotate(45 100 100)"
    fill="#ffffff"
    stroke="#000000"
    stroke-width="7"
  />

  <!-- 3. Intersecting Knot Grid Lines (Forming the woven Hausa knot) -->
  <!-- Re-tracing the inner crossing lines to show the weave -->
  <g transform="rotate(-45 100 100)" stroke="#000000" stroke-width="7" fill="none">
    <line x1="78" y1="78" x2="78" y2="122" />
    <line x1="122" y1="78" x2="122" y2="122" />
  </g>

  <!-- 4. Center Green Diamond -->
  <polygon
    points="100,74 126,100 100,126 74,100"
    fill="#088532"
    stroke="#000000"
    stroke-width="7"
    stroke-linejoin="round"
  />
</svg>
